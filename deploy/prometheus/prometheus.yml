# Local Prometheus for docker compose. In production the API pushes the same
# series to Grafana Cloud via remote_write (see README "Observability").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: pulseops-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
        labels:
          instance: pulseops-api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
